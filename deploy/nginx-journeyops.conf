# Nginx virtual host for the public JourneyOps demo.
# Installed as /etc/nginx/sites-available/journeyops (symlinked into sites-enabled).
# PHP is handled by the journeyops-app container on 127.0.0.1:9085 (see compose.yaml).

server {
    listen 80;
    listen [::]:80;
    server_name journeyops.tickiton.com.br;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/journeyops/public;
    }

    location / {
        return 301 https://journeyops.tickiton.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name journeyops.tickiton.com.br;

    ssl_certificate /etc/letsencrypt/live/journeyops.tickiton.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/journeyops.tickiton.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/journeyops/public;
    index index.php;
    charset utf-8;
    autoindex off;
    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/journeyops-access.log;
    error_log /var/log/nginx/journeyops-error.log;

    # Demo host only: not indexed, basic hardening. Built Vite assets are same-origin;
    # the layout uses one inline script and inline style attributes.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    fastcgi_hide_header X-Powered-By;

    # The ops console lists every visitor's journeys: not part of the public demo.
    location ~ ^/ops(/|$) {
        return 404;
    }

    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9085;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 30s;
    }

    # Never execute or serve anything else ending in .php, dotfiles, or data/log files.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|log|sqlite|sqlite3|db|sql|bak|swp|lock|sh|yml|yaml|md)$ { deny all; }
}
